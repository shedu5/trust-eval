[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trust-eval"
version = "0.1.0"
description = "A miniature oversight harness: can an LLM judge distinguish trustworthy evidence from deliberately fabricated evidence?"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.3",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["trust_eval*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
